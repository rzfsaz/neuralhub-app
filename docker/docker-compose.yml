# NeuralHub · Local Development Stack
# docker compose up -d

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: neuralhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     neuralhub
      POSTGRES_PASSWORD: neuralhub_dev
      POSTGRES_DB:       neuralhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuralhub_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_dev --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "redis_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: PgAdmin for DB inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: neuralhub_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@neuralhub.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # Optional: RedisInsight for cache inspection
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: neuralhub_redisinsight
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
